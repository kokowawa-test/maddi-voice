<!DOCTYPE html>
<html>
<head>
    <title>Maddi Voice Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            text-align:center;
            padding:30px;
        }

        h1{
            color:#0078d4;
        }

        #chat{
            max-width:800px;
            margin:auto;
            background:white;
            height:400px;
            overflow:auto;
            border-radius:10px;
            padding:15px;
            text-align:left;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        button{
            background:#0078d4;
            color:white;
            border:none;
            padding:15px 25px;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
            margin-top:15px;
        }

        button:hover{
            background:#005ea6;
        }
    </style>
</head>

<body>

<h1>🎙️ Maddi Voice Assistant</h1>

<div id="chat">
    <p><b>Maddi:</b> Hello Hamada. Ready for Voice Mode.</p>
    <img id="previewImage"
style="max-width:100px;
        max-height:120px;
        display:none;
        border-radius:10px;
        margin-top:15px;">
</div>

    <br>

<button onclick="startListening()">
🎤 Speak
</button>

<br><br>

<input type="file"
       id="imageUpload"
       accept="image/*"
       onchange="previewSelectedImage(event)">

<br><br>

<script>

function addMessage(sender,text){

    let chat=document.getElementById("chat");

    chat.innerHTML +=
    "<p><b>"+sender+":</b> "+text+"</p>";

    chat.scrollTop = chat.scrollHeight;
}

function speak(text){

    const speech =
    new SpeechSynthesisUtterance(text);

    speech.rate = 1;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
}

function startListening(){

    const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

    const recognition =
    new Recognition();

    recognition.start();

    recognition.onresult = function(event){

        let question =
        event.results[0][0].transcript;

        addMessage("You",question);

        let answer =
        "I heard your question: " + question +
        ". We will connect Maddi to Copilot next.";

        addMessage("Maddi",answer);

        speak(answer);
    };
}
function previewSelectedImage(event){

    const image =
        document.getElementById("previewImage");

    image.src =
        URL.createObjectURL(
            event.target.files[0]
        );

    image.style.display = "block";

    addMessage(
    "Maddi",
    "Image received. Ask me a question about it."
);
}
</script>

</body>
</html>
